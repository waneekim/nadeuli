":"전주동물원 Jeonju Zoo 전북 전주시 덕진구 소리로 68 전주동물원","date":"2026-09-24","pub":"2026-09-24","href":"/nadeuli/zh-hant/posts/20260924-jeonju-zoo/","thumb":"/nadeuli/_astro/thumb.zh-hant.BMdZZgHq_g0VbX.webp"},{"id":"20260925-iksan-earth-under-park","b":"trip","t":"益山黃登採石場咖啡廳「어스언더파크 Earth Under Park」｜隔著整片玻璃俯瞰採石場，谷底的怪手至今仍在採石（秋夕連假）","d":"秋夕連假去益山黃登「어스언더파크 Earth Under Park」的紀錄。隔著整片玻璃，俯瞰削掉一整座山挖下去的巨大花崗岩採石場；變成觀光景點的現在，谷底的怪手還在採石。連假人潮滿滿，賣咖啡、冰淇淋和烘焙點心。菜單價格、營業時間和停車資訊，以及採石場的歷史都整理在這裡。","k":"益山景點 益山咖啡廳 어스언더파크 黃登石山 採石場咖啡廳 全羅北道景點 全州益山旅行","x":"어스언더파크 익산 Earth Under Park Iksan 전북 익산시 황등면 황등7길 34","date":"2026-09-25","pub":"2026-09-25","href":"/nadeuli/zh-hant/posts/20260925-iksan-earth-under-park/","thumb":"/nadeuli/_astro/thumb.zh-hant.CCFeb-Ki_RmHxF.webp"},{"id":"20260925-iksan-maillard87","b":"food","t":"益山烤肉｜「마이야르87 Maillard87」：乾式熟成韓豬五花、梅花，再加點松阪豬、橫膈膜，雙人套餐49,000韓元附泡菜鍋","d":"秋夕連假全家去吃的益山乾式熟成韓豬燒肉店「마이야르87 Maillard87」紀錄。點了五花和梅花，又加點松阪豬和橫膈膜，好吃到差點從椅子上翻過去。雙人套餐（五花2人份＋梅花1人份＋鍋物）49,000韓元很划算，附泡菜鍋，擺盤乾淨。牆上菜單價格與店內告示牌的熟成條件都照實寫出。","k":"益山美食 益山烤肉 마이야르87 Maillard87 益山 益山五花肉 乾式熟成五花肉 韓國烤肉","x":"마이야르87 익산점 Maillard87 (Iksan) 전북 익산시 선화로3길 16-3 102호","date":"2026-09-25","pub":"2026-09-25","href":"/nadeuli/zh-hant/posts/20260925-iksan-maillard87/","thumb":"/nadeuli/_astro/thumb.zh-hant.BBFRnzz3_I23L1.webp"},{"id":"20260925-jeonju-dreamland","b":"kids","t":"全州親子景點｜全州動物園裡的小遊樂園「전주드림랜드 Jeonju Dreamland」：沒有一日券，買1・3・5項套票就好","d":"中秋連假帶孩子去全州動物園裡的小遊樂園「전주드림랜드 Jeonju Dreamland」：設施比大型遊樂園小、也沒那麼可怕，國小低年級玩得很滿足；不另收門票、沒有一日券，只要買便宜的設施套票。整理了票價、比動物園更早結束的營業時間，以及想找刺激的人可能會失望的地方。","k":"全州 Dreamland 全州動物園遊樂園 全州親子景點 全州自由行 全州景點 韓國親子遊樂園","x":"전주드림랜드 Jeonju Dreamland 전북 전주시 덕진구 소리로 68","date":"2026-09-25","pub":"2026-09-25","href":"/nadeuli/zh-hant/posts/20260925-jeonju-dreamland/","thumb":"/nadeuli/_astro/thumb.zh-hant.CJBItJ-Q_Z1S2knE.webp"},{"id":"20260927-iksan-jewel-museum-dino","b":"kids","t":"益山寶石博物館＋恐龍主題公園親子遊｜中秋傳統民俗遊戲、韓文字飾品展，光是戶外恐龍遊樂場就玩滿一天","d":"中秋（秋夕）連假尾聲，帶孩子去益山寶石博物館和隔壁的恐龍主題公園（Dino Kids World）。博物館有中秋傳統民俗遊戲體驗，企劃展示室是把韓文字形直接做成飾品的邀請展；恐龍公園雖然沒用到室內設
