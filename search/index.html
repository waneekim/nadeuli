홍칼국수 망포역 맛집 수원 손칼국수","x":"화홍칼국수 경기 수원시 영통구 영통로 94 1층","date":"2026-09-22","pub":"2026-09-22","href":"/nadeuli/posts/20260922-mangpo-hwahong-kalguksu/","thumb":"/nadeuli/_astro/thumb.Do2Oh0kw_ZysIoK.webp"},{"id":"20260922-mangpo-hwangso-gopchang","b":"food","t":"수원 망포 벽적골 황소곱창 — 곱창·대창·막창 모둠에 간·천엽 먼저, 제일 맛있었던 건 염통","d":"친구랑 둘이서 곱창 생각날 때 늘 가는 수원 망포 벽적골 황소곱창 실방문 기록. 곱창·대창·막창을 따로도 모둠으로도 팔고, 자리에 앉으면 간과 천엽이 먼저 나옵니다. 불판에서 익는 모습은 움짤로 담았고, 바로 앞 망포 공영주차장 요금(하루 7,000원, 전기차 3,000원)과 캐치테이블 운영, 문 앞에 붙은 오후 4시 오픈 안내까지 적었습니다.","k":"망포 황소곱창 수원 곱창 맛집 벽적골 황소곱창 망포역 맛집 수원 망포 곱창","x":"벽적골황소곱창 망포본점 경기 수원시 영통구 영통로214번길 9 서린프라자","date":"2026-09-22","pub":"2026-09-22","href":"/nadeuli/posts/20260922-mangpo-hwangso-gopchang/","thumb":"/nadeuli/_astro/thumb.BwunMXu4_Z2hnn6p.webp"},{"id":"20260924-jeonju-zoo","b":"kids","t":"추석에 간 전주동물원 — 어른 3,000원에 한 바퀴, 곰·호랑이·미어캣 보고 드림랜드에서 체력 방전","d":"추석 연휴에 가족들이 모여 다녀온 전주동물원 기록. 케이지마다 동물이 들어차 있어서 코끼리·뱀·곰·새·원숭이까지 한 바퀴를 다 돌았습니다. 동선이 공원처럼 정리돼 있고 화장실이 곳곳에 있어 아이들과 다니기 편했어요. 곰과 호랑이는 사진으로, 미어캣과 앵무새는 움짤로 담았고 입장료·관람시간은 전주시 공식 안내 기준으로 정리했습니다. 동물원 안 드림랜드는 저학년 아이들 체력 빼기에 좋았습니다.","k":"전주동물원 전주 아이와 갈만한 곳 전주동물원 입장료 전주 드림랜드 추석 가족 나들이","x":"전주동물원 전북 전주시 덕진구 소리로 68 전주동물원","date":"2026-09-24","pub":"2026-09-24","href":"/nadeuli/posts/20260924-jeonju-zoo/","thumb":"/nadeuli/_astro/thumb.Dutq8kp5_ZhpEKW.webp"},{"id":"20260925-iksan-earth-under-park","b":"trip","t":"익산 어스언더파크 — 채석장을 통유리로 내려다보는 카페, 지금도 바닥에선 포크레인이 돌을 캡니다 (추석 연휴)","d":"추석 연휴에 들른 익산 황등의 어스언더파크 카페 기록. 산 하나를 깎아 내려간 거대한 화강암 채석장을 통유리 너머로 내려다보는 곳인데, 관광지가 된 지금도 채석장 바닥에서는 포크레인이 돌을 캐고 있습니다. 연휴라 카페 안은 사람으로 가득했고, 커피·아이스크림·구움과자를 팝니다. 메뉴판 가격과 운영시간·주차는 다이닝코드와 한국관광공사 정보로, 채석장의 내력은 문화일보 기사로 정리했습니다.","k":"익산 어스언더파크 어스언더파크 익산 익산 채석장 카페 황등석산 익산 가볼만한곳","x":"어스언더파크 익산 전북 익산시 황등면 황등7길 34","date":"2026-09-25","pub":"2026-09-25","href":"/nadeuli/posts/20260925-iksan-earth-under-park/","thumb":"/nadeuli/_astro/thumb.ClnJggi7_ZHjvB7.webp"},{"id":"20260925-iksan-maillard87","b":"food","t":"익산 마이야르87 — 선진포크한돈 드라이에이징 삼겹·목살에 항정·갈매기까지, 2인 세트 49,000원에 김치찌개","d":"추석 연휴에 온 가족이 간 익산의 드라이에이징 한돈구이집 마이야르87 기록. 삼겹살과 목살에 항정살·갈매기살까지 시켰는데 뒤집어지는 줄 알았을 만큼 맛있었습니다. 2인 세트(삼겹 2인분+목살 1인분+찌개)는 49,000원이라 가성비가 좋았고, 김치찌개가 같이 나오고, 상차림이 깔끔합니다. 벽 메뉴판 가격과 매장 안내판의 숙성 조건까지 그대로 옮겼습니다.","k":"익산 마이야르87 마이야르87 익산 삼겹살 맛집 선진포크한돈 익산 드라이에이징 삼겹살","x":"마이야르87 익산점 전북 익산시 선화로3길 16-3 102호","date":"2026-09-25","pub":"2026-09-25","href":"/nadeuli/posts/20260925-iksan-maillard87/","thumb":"/nadeuli/_astro/thumb.CpMOQmRi_Z1MpEyu.webp"},{"id":"20260927-iksan-jewel-museum-dino","b":"kids","t":"익산 보석박물관·공룡테마공원 — 추석 민속놀이와 한글 장신구 전시, 옆 다이노키즈 야외 놀이터만으로 하루가 찼어요","d":"추석 연휴 끝자락에 아이들과 다녀온 익산 보석박물관과 바로 옆 공룡테마공원(다이노키즈월드) 기록. 보석박물관은 추석맞이 전통 민속놀이 체험을 열고 있었고, 기획전시실에서는 한글을 그대로 장신구로 만든 '한글, 디자인이 되다' 초대전을 하고 있었습니다. 공룡테마공원은 실내 시설을 못 썼는데도 거대한 미끄럼틀, 실물 크기 브라키오사우루스, 땅에 묻힌 화석, 거미줄 줄타기, 집라인이 있는 야외 놀이터만으로 하루가 충분했어요. 운영시간·휴관일은 익산시 공식 안내로 정리했습니다.","k":"익산 보석박물관 익산 공룡테마공원 다이노키즈월드 익산 아이와 가볼만한곳 보석박물관 한글 디자인이 되다","x":"익산보석박물관 전북 익산시 왕궁면 호반로 8 보석박물관 익산 공룡테마공원 전북 익산시 왕궁면 호반로 8","date":"2026-09-27","pub":"2026-09-27","href":"/nadeuli/posts/20260927-iksan-jewel-museum-dino/","thumb":"/nadeuli/_astro/thumb.dpGG1ocZ_1yVlf9.webp"},{"id":"20260927-iksan-mireuksaji-media-art","b":"trip","t":"익산 미륵사지 국가유산 미디어아트 — 사라진 목탑이 빛으로 돌아온 밤, 돗자리 들고 앞쪽에 앉으세요","d":"추석 연휴 밤에 다녀온 '2026 국가유산 미디어아트 익산' 기록. 미륵사지 한가운데 빛으로 세운 목탑과 양옆 석탑에 레이저와 영상을 입혀, 저녁 7시 30분부터 30분 간격으로 미디어아트를 보여 줬습니다. 푸드트럭이 서고 치킨 배달도 돼서 잔디밭에서 먹으며 봤어요. 돗자리와 소풍 용품, 앞자리, 행사 끝나기 전 화장실, 1시간 먼저 도착하는 주차까지 — 다음에 갈 사람을 위한 팁을 모았습니다.","k":"익산 미륵사지 미디어아트 국가유산 미디어아트 익산 미륵사지 야경 미륵사지 목탑의 귀환 익산 가볼만한곳","x":"미륵사지 전북 익산시 금마면 기양리 32-7","date":"2026-09-27","pub":"2026-09-27","href":"/nadeuli/posts/20260927-iksan-mireuksaji-media-art/","thumb":"/nadeuli/_astro/thumb._EQiIprl_inSDd.webp"},{"id":"20260927-magok-daebo-kalguksu","b":"food","t":"마곡 달인대보칼국수 본점 — 상추·고추양념 올린 감자채전, 라면보다 깊은 장칼국수, 심심하게 짭조름한 맑은 칼국수","d":"마곡 보타닉푸르지오시티 서관의 달인대보칼국수 본점에 아이들과 처음 간 저녁 기록. 제일은 감자채전이었어요. 상추 무침과 고추양념을 함께 올려 먹으니 환상의 맛. 얼큰한 장칼국수는 라면보다 훨씬 깊은 맛이었고, 맑은 칼국수는 심심하면서 약간 짭조름한 게 일품이었습니다. 면 뽑는 모습은 :"20260930-hausly-magok","b":"food","t":"마곡 하우슬리 — 고소하고 맛있었던 아메리카노 3,800원, 핸드드립 카페의 휘낭시에와 페이스페이","d":"수요일 점심에 들른 마곡동로3길의 핸드드립 카페 하우슬리(haüsly) 기록. 아메리카노가 고소하고 맛있었습니다. 페이스페이 제휴 매장이에요. 아메리카노 3,800원·카페 라떼 4,200원, 핸드드립은 원두 아홉 가지 5,000~9,500원이고, 브라질 원두 두 가지에 '고소한 맛' 표시가 붙어 있어요. 휘낭시에 여섯 가지와 보관 안내까지 매장 메뉴판·진열장 그대로 옮겼습니다.","k":"마곡 하우슬리 하우슬리 hausly 마곡 핸드드립 마곡역 카페 마곡 휘낭시에","x":"하우슬리 서울 강서구 마곡동로3길 26 1층 111호","date":"2026-09-30","pub":"2026-09-30","href":"/nadeuli/posts/20260930-hausly-magok/","thumb":"/nadeuli/_astro/thumb.D81sI_Fb_1bxGtY.webp"},{"id":"20261002-ilsikbi-magok","b":"food","t":"마곡 일식비 — 점심 특선 인당 29,000원, 회부터 초밥·튀김·돌솥밥까지 이어진 한 상","d":"마곡 LG사이언스파크 근처 상가 건물 3층의 일식집 일식비에서 점심 특선을 먹었어요. 인당 29,000원에 샐러드와 죽, 나무 칸에 담긴 회, 크로켓, 구이, 초밥, 새우튀김과 탕, 돌솥밥까지 차례로 나왔습니다. 꼭 추천하고 싶은 집이고, 직장인 점심이나 회식에 딱 어울려요. 나온 순서대로의 사진과 움짤, 사시미 먹는 법 안내, 저녁 코스 가격, 주차·브레이크타임까지 정리했습니다.","k":"마곡 일식비 일식비 점심 특선 마곡 회식 장소 마곡 횟집 발산역 일식","x":"일식비 서울 강서구 마곡동로 61 에이스프라자 3층","date":"2026-10-02","pub":"2026-10-02","href":"/nadeuli/posts/20261002-ilsikbi-magok/","thumb":"/nadeuli/_astro/thumb.SVh-o8Zj_ZbqJx.webp"},{"id":"20261002-songdo-galmaegi-magok","b":"food","t":"송도갈매기 마곡점 — 연한 소갈빗살 먼저, 달달한 양념 갈매기살, 아이들이 두 그릇 뚝딱 비운 케이스퀘어 고깃집","d":"마곡 케이스퀘어 지하 2층 송도갈매기에서 가족 저녁을 먹었어요. 소생갈빗살을 먼저 굽고 양념한 전통갈매기를 이어 먹었는데, 소갈빗살은 연하고 갈매기살은 달달하고 맛있었습니다. 첫째와 둘째 아들이 두 그릇을 뚝딱 비웠고, 갈비탕이 맛있어서 어른들도 공기밥을 하나씩 다 비웠어요. 매장 안 스마트팜에서 직접 키운 쌈채소가 굉장히 신선했습니다. 주문 화면의 메뉴와 가격, 위치까지 정리했어요.","k":"송도갈매기 마곡점 마곡 갈매기살 케이스퀘어 맛집 마곡 아이와 고깃집 마곡 스마트팜 식당","x":"송도갈매기 마곡점 서울 강서구 마곡중앙로 105-7 케이스퀘어 마곡 타워1 지하2층 B213-2호","date":"2026-10-03","pub":"2026-10-03","href":"/nadeuli/posts/20261002-songdo-galmaegi-magok/","thumb":"/nadeuli/_astro/thumb.xRuTeEIt_1WiTo0.webp"},{"id":"20261002-mammoth-express-magoknaru","b":"food","t":"매머드익스프레스 마곡나루역5번출구점 — 아메리카노 1,600원, 출근길에 한 잔 들르기 좋은 가성비 커피","d":"마곡나루역 5번 출구 앞, 롯데캐슬 르웨스트 1층의 매머드익스프레스 기록. 아메리카노가 1,600원(M)이라 출근길에 한 잔 들렀다 가기 좋아요. 아침 6시 30분에 여는 테이크아웃 전용 매장이고, 키오스크와 매머드오더 앱으로 주문합니다. 매장 메뉴판의 사이즈별 가격(S·M·L), 디카페인 변경, 결제 수단, 영업시간까지 정리했어요." 셀 함수 엑셀 매크로 chatgpt","x":"","date":"2026-09-11","pub":"2026-09-11","href":"/posts/20260911-chatgpt-excel-prompts/","thumb":"/nadeuli/_astro/titlecard.BbG5WTWo_104XcB.webp"},{"id":"20260914-vibe-coding-silent-failures","b":"ai","t":"바이브 코딩 한계, ‘됐다’던 AI 자동화가 깨진 실패 사례 5가지","d":"AI에게 짜게 한 자동화가 닷새 사이 다섯 번 깨졌다. 공통점은 하나 — 코드가 확인한 것은 매번 '성공'이었는데, 실제 결과는 달랐다. 이 블로그의 발행 시스템에서 실제로 일어난 사건 다섯 개를 날짜·원인·고친 코드와 함께 적고, 바이브 코딩이 잘 못 하는 것과 그걸 메우는 원칙 세 가지를 정리했다.","k":"바이브 코딩 한계 바이브 코딩 실패 사례 AI 자동화 실패 AI 코딩 검증 바이브 코딩 단점","x":"","date":"2026-09-14","pub":"2026-09-14","href":"/posts/20260914-vibe-coding-silent-failures/","thumb":"/nadeuli/_astro/titlecard.Lq_dBZfp_1D4Aio.webp"},{"id":"20260913-macmini-agent-machine","b":"ai","t":"맥미니 M4 AI 에이전트 서버, 24시간 전기와 장단점 정리","d":"AI 에이전트는 내가 노트북을 닫으면 멈춥니다. 그래서 자동화 전용 기계를 따로 뒀습니다. 맥미니 M4를 오픈클로 전용으로 구축해 한 달 굴려본 기록 — 역할을 분리하는 이유, 애플 공식 수치로 따져본 24시간 전기값, 그리고 세팅에 드는 품까지.","k":"AI 에이전트 전용 pc 맥미니 m4 서버 오픈클로 자동화 전용 머신 맥미니 24시간","x":"","date":"2026-09-13","pub":"2026-09-13","href":"/posts/20260913-macmini-agent-machine/","thumb":"/nadeuli/_astro/titlecard.CGpLXxN4_Z17fHki.webp"},{"id":"20260921-n8n-vs-zapier","b":"ai","t":"n8n vs Zapier 비교, 요금표보다 셈법으로 고르는 법","d":"n8n과 Zapier의 차이는 요금표 숫자보다 '무엇을 세는가'에 있다. Zapier는 성공한 액션 단계마다 태스크 하나, n8n은 워크플로가 한 번 돌면 단계가 몇 개든 실행 하나. 2026년 10월 7일 공식 요금 페이지를 다시 확인해 표로 정리하고, 제 블로그 자동화(하루 1번, 4단계)를 두 도구로 옮기면 한 달에 얼마가 되는지 계산했다. 직접 설치(셀프호스팅)의 조건과 라이선스, 그리고 누구에게 뭐가 맞는지까지.","k":"n8n vs zapier n8n zapier 비교 n8n 요금 zapier 요금제 노코드 자동화 도구 비교","x":"","date":"2026-09-21","pub":"2026-09-21","href":"/posts/20260921-n8n-vs-zapier/","thumb":"/nadeuli/_astro/titlecard.ZGjZiidZ_Z22km54.webp"},{"id":"20260921-queue-doctor-silent-stalls","b":"ai","t":"자동화 모니터링, 로그가 초록불인데 멈춘 작업 찾는 법","d":"제 블로그의 자동 발행 큐는 12일 내내 '정상 종료'였는데, 그 아래에서 글이 네 가지 모양으로 멈춰 있었다 — 예약일이 비어서, 대본 파일이 옛 형식이라서, 올라갔는데 기록이 없어서, 브라우저에 엉뚱한 계정이 로그인돼 있어서. 자동화가 '오류'가 아니라 '해당 없음'으로 멈추는 이유, 그래서 매일 릴리스 직후 붙인 점검 여섯 항목, 붙인 뒤 19일 동안 실제로 잡은 것까지 적었다.","k":"자동화 모니터링 자동화 실패 감지 스케줄 자동화 점검 AI 자동화 운영 배치 작업 멈춤","x":"","date":"2026-09-21","pub":"2026-09-21","href":"/posts/20260921-queue-doctor-silent-stalls/","thumb":"/nadeuli/_astro/titlecard.NWduQfnD_Z2MCyD.webp"},{"id":"20260921-subagent-batch-32-posts","b":"ai","t":"클로드 코드 서브에이전트 활용, 동시에 맡겨도 안 흐트러지는 법","d":"리뷰와 사진만 있는 소재 32개를 하루 만에 글 32편으로 만들었다. 비결은 AI가 빨라서가 아니라 잡지사의 방식을 그대로 옮긴 것 — 편집장(메인 세션)이 브리프 한 장과 취재 노트(패킷) 32개를 만들고, 작가(서브에이전트) 열한 명이 동시에 쓰고, 검수원(스크립트)이 형식을 거른다. 실제 브리프·패킷·검수 코드와, 작가가 패킷의 오류를 되잡은 네 장면을 그대로 적었다.","k":"claude code 서브에이전트 활용 서브에이전트 병렬 작업 AI 글쓰기 자동화 클로드 코드 실전 사례 AI 콘텐츠 대량 생산","x":"","date":"2026-09-21","pub":"2026-09-21","href":"/posts/20260921-subagent-batch-32-posts/","thumb":"/nadeuli/_astro/titlecard.C96PaGWB_ZH3vjB.webp"},{"id":"20260922-jev-confidence-routing","b":"ai","t":"Jev 사용법, 확신도로 자동·확인·사람 세 갈래 나누기","d":"TypeSafe AI의 Jev를 공식 문서의 예제 그대로 따라간다. SDK를 설치하고 고객 문의 한 통에 질문 셋(어느 팀·얼마나 화남·급한가)을 한 번에 보내, 돌아온 확률과 확신도로 자동 처리·확인 후 진행·사람에게 넘기기 세 갈래를 만드는 법. 확신도 계산, 문턱값 예제, 질문 쓰는 요령, 한도·요금·오류 코드까지 2026년 10월 7일 문서와 다시 대조했다. Jev 3부작의 2편.","k":"jev 사용법 jev api calibrated confidence ai 확신도 라우팅 typesafe api","x":"","date":"2026-09-22","pub":"2026-09-22","href":"/posts/20260922-jev-confidence-routing/","thumb":"/nadeuli/_astro/titlecard.BJpuWBAY_Z2kF0hm.webp"},{"id":"20260922-llm-gateway-fast-decisions","b":"ai","t":"LLM 게이트웨이 판정 API, Jev 계약을 옮겨 붙인 기록","d":"여러 앱이 AI를 부를 때 거치는 단일 창구(LLM 게이트웨이)에 '빠른 판정' 창구 POST /v1/decisions를 새로 냈다. TypeSafe AI Jev의 계약(상태와 타입 질문을 보내면 확률적 결정이 돌아온다)을 그대로 채택하고, 진짜 Jev와 챗 모델의 흉내라는 두 경로로 같은 모양을 낸다. 속도 이득의 실체(생성은 안 빨라진다), 키와 기록을 다룬 규칙, 남은 숙제를 릴리스 노트와 코드 기준으로 적었다. Jev 3부작의 3편.","k":"llm 게이트웨이 ai 판정 api jev 연동 llm 게이트웨이 구축 빠른 판정 엔드포인트","x":"","date":"2026-09-22","pub":"2026-09-22","href":"/posts/20260922-llm-gateway-fast-decisions/","thumb":"/nadeuli/_astro/titlecard.NFi7XqXh_ZuiAPY.webp"},{"id":"20260922-system-one-model-jev","b":"ai","t":"System One 모델 Jev란, 글을 쓰지 않고 고르는 AI","d":"2026년 9월 15일 TypeSafe AI가 발표한 Jev는 글을 쓰지 않는 AI다. 상태와 미리 정한 질문표를 보내면 하나 고르기·단계 매기기·예/아니오를 확률과 함께 0.07~0.5초에 돌려준다. System One 모델의 뜻과 LLM과의 차이, 세 가지 질문 유형, 보정된 확률이 왜 핵심인지, 문서가 밝힌 약점과 쓰는 자리를 공식 발표문·문서(2026년 10월 7일 확인) 기준으로 정리했다.","k":"system one 모델 typesafe jev jev 모델 시스템1 ai 결정 모델 ai","x":"","date":"2026-09-22","pub":"2026-09-22","href":"/posts/20260922-system-one-model-jev/","thumb":"/nadeuli/_astro/titlecard.BEuF_IPK_5s3pW.webp"},{"id":"20260925-claude-opus-5-5","b":"ai","t":"Claude Opus 5.5 벤치마크·가격, Fable 5.1과 비교","d":"2026년 9월 22일 앤트로픽이 Claude Opus 5.5를 내놨다. '대부분의 작업에서 Fable 5.1 수준, 운영 비용은 Opus 5보다 40% 적다'는 게 회사 설명이다. 공식 발표 표의 벤치마크 9개를 그대로 옮겨 이전 버전 Opus 5, 상위 모델 Fable 5.1, 경쟁 모델 GPT-6 Astra·GPT-5.6 Sol과 비교하고, 가격·속도·안전성 평가까지 정리했다. Opus 5.5가 지는 항목과 회사 스스로 밝힌 한계도 함께.","k":"claude opus 5.5 클로드 오퍼스 5.5 opus 5.5 벤치마크 fable 5.1 비교 opus 5.5 가격","x":"","date":"2026-09-25","pub":"2026-09-25","href":"/posts/20260925-claude-opus-5-5/","thumb":"/nadeuli/_astro/titlecard.vHjXLWZ1_Zvx907.webp"},{"id":"20260922-mcp-vs-api-vs-cli","b":"ai","t":"MCP vs API vs CLI 차이, 언제 무엇을 쓸지 한 표로","d":"AI 글에 늘 같이 나오는 MCP·API·CLI를 비개발자 눈높이로 가른다. CLI는 기계에 달린 버튼(사람이나 터미널을 쥔 AI가 명령으로), API는 기기별 리모컨(프로그램이 서비스마다 다른 양식으로), MCP는 통합 리모컨 규격(AI가 도구 목록을 받아 스스로 고름). 구글 드라이브에 파일 올리기를 세 방식으로 해 보고, 상황별로 무엇을 고를지 표로 정리했다. 공식 문서와 2026년 10월 7일 대조.","k":"mcp api 차이 mcp cli 차이 mcp vs api cli 뜻 ai 도구 연결 방식","x":"","date":"2026-09-22","pub":"2026-09-22","href":"/posts/20260922-mcp-vs-api-vs-cli/","thumb":"/nadeuli/_astro/titlecard.DGIFWccx_Z1NB4jX.webp"},{"id":"20260927-personal-ai-agents-four","b":"ai","t":"오픈클로·헤르메스·그록봇·메타 뮤즈 비교, AI 에이전트 차이","d":"일을 대신 해 주는 AI 에이전트 네 갈래 — 개인 개발자가 만든 오픈소스 오픈클로, 쓸수록 스스로 배우는 헤르메스 에이전트, 봇마다 클라우드 컴퓨터를 주는 xAI 그록봇, 설치 없는 일반인용 메타 뮤즈. 비서를 두는 네 가지 방법에 빗대 나온 순서, 한눈에 비교, 기술 차이 여섯 가지, 뮤즈가 다른 점과 누구에게 맞는지를 공식 자료와 보도(2026년 10월 7일 다시 확인) 기준으로 정리했다.","k":"AI 에이전트 비교 오픈클로 헤르메스 차이 그록봇 메타 뮤즈 개인 AI 에이전트","x":"","date":"2026-09-27","pub":"2026-09-27","href":"/posts/20260927-personal-ai-agents-four/","thumb":"/nadeuli/_astro/titlecard.C91hh0o3_Z1bynIU.webp"},{"id":"20261001-gpt-6-1-sol","b":"ai","t":"GPT-6.1 Sol 발표, 가격·성능과 Sonnet 5.5 비교","d":"2026년 9월 29일 OpenAI가 DevDay에서 GPT-6.1 Sol을 발표했다. GPT-6 Sol을 크게 업그레이드한 모델로, 회사 설명으로는 최상위 모델 GPT-6 Astra에 가까운 성능을 Astra 토큰 가격의 5분의 1에 낸다. API 가격은 100만 토큰당 입력 2달러·출력 10달러로 Claude Sonnet 5.5와 같고, 캐시된 입력은 0.1달러다. 공식 발표문의 코딩·문서·업무 자동화·컴퓨터 사용·과학 연구·사실 정확성 결과와 안전 평가, Ultrafast와 새 Pro 요금제, 그리고 하루 먼저 나온 Claude Sonnet 5.5와 나란히 놓고 볼 점까지 정리했다.","k":"GPT-6.1 Sol gpt-6.1-sol GPT 6.1 솔 GPT-6.1 Sol 가격 GPT-6.1 Sol 벤치마크 OpenAI DevDay 2026","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-gpt-6-1-sol/","thumb":"/nadeuli/_astro/titlecard.DK6v0tLX_16zAbA.webp"},{"id":"20261001-claude-sonnet-5-5","b":"ai","t":"Claude Sonnet 5.5 출시, 가격·성능과 Opus 5.5 비교","d":"2026년 9월 28일 앤트로픽이 Claude Sonnet 5.5를 내놨다. Claude 5.5 계열의 두 번째 모델로, 가격은 Sonnet 5와 같은 100만 토큰당 입력 2달러·출력 10달러인데 답을 내는 속도는 30% 이상 빨라졌다는 게 회사 설명이다. 공식 발표 표의 벤치마크 8개를 그대로 옮겨 이전 버전 Sonnet 5, 윗급 Opus 5.5, 경쟁 모델 GPT-6 Sol과 비교하고, 가격·스펙·안전 조치, 그리고 회사 스스로 밝힌 'Opus 5.5가 여전히 나은 일'까지 정리했다.","k":"claude sonnet 5.5 클로드 소넷 5.5 sonnet 5.5 벤치마크 sonnet 5.5 가격 opus 5.5 sonnet 5.5 비교","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-claude-sonnet-5-5/","thumb":"/nadeuli/_astro/titlecard.DKywGCfZ_2juxE3.webp"},{"id":"20261001-llmgw-01-idle-subscriptions","b":"ai","t":"LLM 게이트웨이를 직접 만든 이유, 퇴근하면 노는 AI 구독 (LLM 중계기 개발기)","d":"매달 결제하는 Codex와 Claude는 내가 채팅창 앞에 앉아 있을 때만 일합니다. 웹·앱·터미널·편집기 플러그인이라는 서로 다른 껍데기에 갇혀 있기 때문이에요. 여러 AI를 주소 하나 뒤에 세워 내 프로그램 어디서든 골라 쓰거나 동시에 쓰게 해 주는 'LLM 중계기'를 직접 만든 이야기의 첫 편. 왜 만들었는지, 처음에 던진 세 가지 질문, 중계기 전과 후에 연결선이 어떻게 달라지는지를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 llm 게이트웨이란 ai 구독 활용 openai 호환 api 여러 ai 같이 쓰기","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-01-idle-subscriptions/","thumb":"/nadeuli/_astro/titlecard.XQ8e98IB_9vJa5.webp"},{"id":"20261001-llmgw-02-what-is-relay","b":"ai","t":"LLM 게이트웨이 구조, 질문 하나가 지나가는 네 칸과 두 창구 (LLM 중계기 개발기)","d":"여행용 멀티 어댑터를 열어 보면 꽂는 구멍, 모양을 바꾸는 부품, 과부하를 막는 장치가 따로 있습니다. 제가 만든 LLM 중계기도 안을 열어 보면 칸이 나뉘어 있어요. 프로그램이 보낸 질문 하나가 창구 → 교통정리 → 어댑터를 지나 AI에 닿고 답이 조금씩 흘러 돌아오는 길, 사람용 관리 화면과 프로그램용 API라는 두 창구, 요청마다 남는 기록(토큰·첫 글자까지 걸린 시간·끝난 이유), 그리고 처음부터 지키는 세 가지 안전 기본값을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 구조 llm 게이트웨이 동작 원리 ai 스트리밍 응답 api 키 암호화 저장 여러 ai 같이 쓰기","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-02-what-is-relay/","thumb":"/nadeuli/_astro/titlecard.CQQ2QOUk_Z287UkG.webp"},{"id":"20261001-llmgw-03-openai-compatible","b":"ai","t":"OpenAI 호환 API 뜻, 표준이 된 이유와 빈틈 4가지 (LLM 중계기 개발기)","d":"AI 도구 설명에 자주 보이는 'OpenAI 호환'은 OpenAI의 AI를 쓴다는 뜻이 아니라, OpenAI가 정한 대화 요청의 모양을 따른다는 뜻입니다. 이 모양이 널리 쓰이면서 LM Studio 같은 프로그램도 같은 모양으로 창구를 열고, 제가 만든 LLM 중계기도 이 모양 덕분에 주소 한 줄로 어떤 프로그램이든 받게 됐어요. 그런데 '호환'인데도 끝난 이유, 생각 과정, 빈 도구 목록, 거절 이유에서 AI마다 조금씩 달라 하나씩 맞춰야 했습니다. 그 이득과 한계를 비개발자 눈높이로 정리했습니다.","k":"openai 호환 api openai 호환이란 llm 중계기 lm studio openai 호환 ai api 표준","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-03-openai-compatible/","thumb":"/nadeuli/_astro/titlecard.J1zhRLZ__1ieP9h.webp"},{"id":"20261001-llmgw-07-empty-desk","b":"ai","t":"CLAUDE.md·AGENTS.md가 질문마다 실린 사고와 빈 폴더 (LLM 중계기 개발기)","d":"Codex와 Claude의 명령어 도구는 켜진 폴더의 안내문과 기억을 먼저 읽고 일을 시작합니다. 코딩할 때는 고마운 기능인데, 제가 만든 중계기가 이 AI들을 자기 폴더에서 켜는 바람에 평범한 채팅 질문에도 중계기 개발 메모가 덤으로 실렸어요. 같은 질문인데 켠 폴더에 따라 답이 달라진 증상, 원인, 아무것도 없는 전용 폴더로 자리를 옮긴 해결, 그리고 '채팅은 빈 책상, 일은 내가 고른 폴더'라는 규칙을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 claude.md agents.md 뜻 ai 명령어 도구 폴더 토큰 뜻 codex claude 연동","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-07-empty-desk/","thumb":"/nadeuli/_astro/titlecard.BHFZSdWO_x4EsY.webp"},{"id":"20261001-llmgw-05-adapters","b":"ai","t":"어댑터 패턴, AI마다 다른 플러그를 한 창구로 묶는 법 (LLM 중계기 개발기)","d":"어떤 AI는 웹 주소로, 어떤 AI는 내 컴퓨터의 명령어 도구로, 또 어떤 AI는 로컬 서버로 불러야 합니다. 플러그 모양이 다 다른 셈이에요. 제가 만든 LLM 중계기는 AI마다 작은 어댑터를 하나씩 끼우고, 모든 어댑터가 확인·목록·특성·대화라는 네 가지 약속을 같은 모양으로 지키게 했습니다. 그 덕분에 바깥 프로그램은 메뉴판 한 장만 보면 되고, 새 AI는 어댑터 파일 하나와 등록 한 줄로 들어옵니다. 첫 버전 닷새 뒤 NVIDIA를 붙인 날의 기록까지 비개발자 눈높이로 정리했습니다.","k":"llm 어댑터 llm 게이트웨이 구조 여러 ai 한 번에 연결 ai 연결 방식 차이 openai 호환 모델 목록","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-05-adapters/","thumb":"/nadeuli/_astro/titlecard.BKdHb6XD_Z201nqx.webp"},{"id":"20261001-llmgw-06-spawn-vs-resident","b":"ai","t":"세션 재사용과 워밍업, AI를 새로 켤까 켜 둔 채 쓸까 (LLM 중계기 개발기)","d":"Codex와 Claude의 명령어 도구는 내 컴퓨터에서 켜야 대답하는 프로그램이라, 중계기는 요청마다 새로 켤지 켜 둔 채 다시 쓸지를 정해야 했습니다. 콜택시와 셔틀버스에 빗대어 두 방식의 속도·기억 섞임·메모리·정리 부담을 비교하고, 중계기가 Codex(앱 서버 하나에 요청마다 새 대화방)와 Claude(프로그램별 세션 최대 6개, 5분 쉬면 정리)를 어떻게 다루는지 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 프로세스 재사용 세션 풀이란 워밍업 뜻 codex claude 연동","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-06-spawn-vs-resident/","thumb":"/nadeuli/_astro/titlecard.BXWU0JqI_Z57tTg.webp"},{"id":"20261001-llmgw-04-first-day","b":"ai","t":"AI 페어 프로그래밍, 하루 만에 첫 버전을 만든 이삿날 기록 (LLM 중계기 개발기)","d":"LLM 중계기의 첫날은 이삿날 같았습니다. 아침 8시에 여러 AI를 'OpenAI 호환' 창구 하나 뒤에 세운 첫 버전이 나왔고, 윈도에서 처음 켜 보자 고장이 줄줄이 나왔고, 밤 10시가 넘어서야 v0.1.16으로 하루를 마감했어요. 그날 쌓인 저장 기록을 시간 순서로 펼쳐, AI 코딩 도우미와 짝을 이뤄 작은 판을 여러 번 올린 방법과 '고장 하나에 검사 하나'라는 습관이 생긴 과정을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 ai 페어 프로그래밍 ai와 함께 코딩 하루 만에 첫 버전 버그 하나에 검사 하나","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-04-first-day/","thumb":"/nadeuli/_astro/titlecard.BMnHLH7M_Z1nDtkT.webp"},{"id":"20261001-llmgw-09-spec-cards","b":"ai","t":"LLM 모델 스펙 비교, 에너지 라벨처럼 카드로 만든 이유 (LLM 중계기 개발기)","d":"냉장고를 고를 때는 옆면의 라벨을 나란히 놓고 비교하죠. 제가 만든 LLM 중계기의 메뉴판에는 처음에 모델 이름만 있어서, 쓰는 쪽 프로그램은 모델마다 한 번에 얼마나 읽는지, '끝났다'는 표시를 믿어도 되는지, 생각하느라 답 분량을 얼마나 쓰는지 알 수 없었어요. 이걸 프로그램이 읽는 스펙 카드로 내놓은 이야기입니다. 글을 잘게만 쪼개 보내던 도구 때문에 카드가 생긴 날, 양식이 어긋나 빈칸만 보이던 카드를 같은 날 아침에 고친 일, 그리고 '모르면 비워 둔다'는 규칙까지 비개발자 눈높이로 정리했습니다.","k":"llm 모델 스펙 비교 컨텍스트 창이란 끝난 이유 finish_reason 추론 모델 토큰 예산 llm 게이트웨이 model traits","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-09-spec-cards/","thumb":"/nadeuli/_astro/titlecard.Dd4H9NkN_ZRclDp.webp"},{"id":"20261001-llmgw-10-tollgate","b":"ai","t":"AI 동시 요청 제한과 429, 중계기에 톨게이트를 세운 이유 (LLM 중계기 개발기)","d":"AI마다 한꺼번에 받을 수 있는 질문 수가 정해져 있어서, 들어오는 대로 넘기기만 하는 중계기는 금방 막히거나 '너무 많다(429)'는 거절을 받습니다. 제가 만든 LLM 중계기 한가운데에는 그래서 요금소 같은 교통정리 칸이 있어요. AI별·모델별 차선(Codex 3, Claude 3, NVIDIA 4, LM Studio 1), 길이와 시간이 정해진 대기 줄, 전체 상한(동시 10건·줄 포함 16건), 꽉 찼을 때 매달아 두지 않고 이유와 다시 올 시간을 알려 주는 방식, 사람이 기다리는 요청을 먼저 들여보내는 순서까지 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 llm 게이트웨이 동시성 ai api 429 too many requests 요청 대기열 ai 동시 요청 제한","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-10-tollgate/","thumb":"/nadeuli/_astro/titlecard.BiHanPqa_xsrBz.webp"},{"id":"20261001-llmgw-08-stray-key","b":"ai","t":"Claude 401 오류, 로그인했는데 옛 API 키가 먼저 쓰인 이유 (LLM 중계기 개발기)","d":"Claude 명령어 도구에 로그인해 둔 컴퓨터에서, 중계기가 Claude를 부르면 401(인증 실패)이 돌아왔습니다. 원인은 컴퓨터 전체에 붙어 있는 설정인 환경 변수에 남아 있던 API 키였어요. Claude가 로그인보다 그 키를 먼저 썼거든요. 환경 변수가 무엇인지, 중계기가 Claude에게 건네는 설정 사본에서 그 키만 지워 로그인을 쓰게 한 방법, 어떤 열쇠를 썼는지 알려 주는 안내와 401·403·429의 차이를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 401 오류 뜻 환경 변수란 anthropic api key 로그인 claude 인증 실패","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-08-stray-key/","thumb":"/nadeuli/_astro/titlecard.JuIiKD_n_ZFqXMt.webp"},{"id":"20261001-llmgw-12-pacer","b":"ai","t":"RPM·TPM 뜻과 429, 거절당하기 전에 간격을 두는 페이서 (LLM 중계기 개발기)","d":"AI 서비스에는 '동시에 몇 건' 말고도 '1분에 몇 번(RPM)', '1분에 토큰 몇 개(TPM)'라는 한도가 있습니다. 넘으면 429라는 거절 번호와 함께 '이만큼 뒤에 다시 오라(Retry-After)'는 안내가 오죠. 제가 만든 LLM 중계기에는 거절당하고 다시 보내는 대신 처음부터 간격을 두고 보내는 '페이서'가 있어요. 최근 1분의 기록을 보며 요청 시작 시각을 고르게 띄우는 방법, 토큰을 미리 잡아 두고 끝나면 고쳐 적는 장부, NVIDIA에는 페이서를 붙이지 않은 이유, 그리고 Gemini API로 본 '잠깐 붐빔'과 '오늘 몫을 다 씀'의 차이를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 rpm tpm 뜻 api 429 retry-after ai api 요청 속도 제한 gemini api 무료 한도","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-12-pacer/","thumb":"/nadeuli/_astro/titlecard.BAmXgjJA_Z1BaXtW.webp"},{"id":"20261001-llmgw-13-missing-lane","b":"ai","t":"설정 누락 장애, '연결 성공'인데 호출이 전멸한 이유 (LLM 중계기 개발기)","d":"새로 붙인 명령어 도구 AI 하나가 '연결 성공'으로 떴는데, 그 뒤 호출은 전부 실패했습니다. AI는 멀쩡했어요. 원인은 중계기의 교통정리 칸에 이 AI의 차선 설정 한 줄이 빠져, 오류 없이 전체 기본값(차선 1개·줄에서 60초)으로 떨어진 것이었습니다. 한 번 부르는 데 1분 가까이 걸리는 AI에게 60초 줄은 너무 짧았고, '연결 확인을 다시 하라'는 실패 안내가 줄을 더 막는 고리까지 만들었어요. 조용한 기본값의 함정, 스스로 불어나는 대기 고리, 부품 시험은 통과했는데 조립품에서 터진 이유, 그리고 '새 AI는 등록 한 줄'이라는 규칙에 붙은 두 번째 줄을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 설정 누락 장애 조용한 기본값 대기열 시간 초과 재시도 루프","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-13-missing-lane/","thumb":"/nadeuli/_astro/titlecard.D-f6J5s5_ZD4hCS.webp"},{"id":"20261001-llmgw-14-mixed-sessions","b":"ai","t":"AI 대화 섞임, 다른 AI가 '저는 Claude예요'라고 한 이유 (LLM 중계기 개발기)","d":"켜 둔 AI 세션 하나를 서로 다른 두 프로그램이 같이 쓰면, 한 프로그램의 대화가 다른 프로그램 요청을 받는 AI의 기억에 남을 수 있습니다. 게다가 대화를 한 덩어리로 합칠 때 '누가 한 말인지' 이름표를 빼 버리자, AI가 다른 AI의 답('저는 Claude입니다')을 자기 말로 받아들이기도 했어요. 공용 메모장을 같이 쓴 두 팀에 빗대어, 두 증상이 모두 '누가'를 잃어버린 데서 왔다는 원인, 프로그램 이름표·프로그램별 세션·요청마다 새 대화방·말마다 이름표라는 해결, '세션은 속도를 위한 준비물'이라는 원칙을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 세션 격리 뜻 ai 대화 섞임 ai 정체성 혼동 codex claude 연동","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-14-mixed-sessions/","thumb":"/nadeuli/_astro/titlecard.Cu13VY98_28DYoL.webp"},{"id":"20261001-llmgw-11-hang-up","b":"ai","t":"AI 요청 취소, '그만' 신호를 끝까지 전해야 하는 이유 (LLM 중계기 개발기)","d":"고객은 전화를 끊었는데 상담원의 수화기에는 그 소식이 오지 않으면, 상담원은 빈 수화기를 든 채 '통화 중'으로 남고 다음 고객은 연결되지 못합니다. 제가 만든 LLM 중계기에도 같은 함정이 있어요. 프로그램이 연결을 끊었을 때 '그만' 신호를 창구 → 줄 → 어댑터 → AI까지 끝까지 전해야 하는 이유, 신호가 한 곳에서 끊기면 AI 차선이 영원히 막히는 구조, 내 컴퓨터에서 돌리는 AI(LM Studio)의 '유령 줄', 15초 안부 신호와 느린 받는 쪽 처리, 그리고 '그만두는 법'을 먼저 설계하라는 교훈을 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 취소 요청 취소 전파 abortcontroller 뜻 동시성 슬롯 누수 lm studio 요청 취소","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-11-hang-up/","thumb":"/nadeuli/_astro/titlecard.Bn_4mChv_5p5zx.webp"},{"id":"20261001-llmgw-15-thinking-budget","b":"ai","t":"추론 모델 max_tokens, 생각만 하다 답 0자로 끝난 이유 (LLM 중계기 개발기)","d":"답하기 전에 속으로 생각하는 AI는 그 생각도 '답에 쓸 수 있는 글자 예산'에서 꺼내 씁니다. 제가 만든 LLM 중계기에서 생각형 AI 하나가 답 예산 8,192토큰을 생각에 전부 써 버려, 생각 33,748자에 답 0자로 돌아온 날이 있었어요. 원인을 따라가 보니 예산은 조심스럽게 작게 잡혀 있었고, 생각이 얼마나 길어질지는 미리 적어 둔 표로 알 수 없었습니다. 실제 생각 분량을 배우고, 답 몫 위에 생각 여유분을 얹고, 그래도 비면 예산을 두 배로 늘려 한 번 더 시도하고, 답에 섞여 오는 생각 꼬리표를 떼어 내는 4겹 방어를 비개발자 눈높이로 정리했습니다.","k":"추론 모델 max_tokens 생각형 ai 답 없음 finish_reason length 추론 토큰 예산 llm 게이트웨이 추론 예산","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-15-thinking-budget/","thumb":"/nadeuli/_astro/titlecard.BKcVw05C_ZKsLP3.webp"},{"id":"20261001-llmgw-17-hidden-failure","b":"ai","t":"Claude 로그인 만료·한도 소진, 성공 응답 속에 숨은 실패 (LLM 중계기 개발기)","d":"Claude가 로그인 만료와 사용 한도 소진을 '성공' 결과에 담아 보낸 날이 두 번 있었습니다. 제가 만든 LLM 중계기는 그 안내문을 진짜 답처럼 넘겼고, 중계기를 쓰던 도구는 엉뚱하게 '답 형식이 틀렸다'며 실패했어요. 중계기가 성공 답을 넘기기 전에 열어 보고 로그인 만료는 인증 실패(401) 갈래로, 한도 소진은 429와 '10분 뒤 다시'로 바꿔 돌려주게 된 경위, 글자를 읽어 판단하는 검사의 약점과 그 울타리(Claude에게만, 성공 답에만, 한도 문구는 600자 이하에만)를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 ai api 200 성공 오류 claude 로그인 만료 insufficient_quota 뜻 llm 게이트웨이 오류 처리","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-17-hidden-failure/","thumb":"/nadeuli/_astro/titlecard.OJ8Ed9oC_2hfa0z.webp"},{"id":"20261001-llmgw-16-cut-answer","b":"ai","t":"AI 답변 잘림, finish_reason ‘다 했음’을 믿기 전에 (LLM 중계기 개발기)","d":"AI의 답장 끝에는 왜 멈췄는지를 적는 '끝난 이유' 칸이 있습니다. 여기에 '다 했음'이 찍히면 프로그램은 잘린 답도 완성본으로 저장해요. 제가 만든 LLM 중계기가 이 칸을 바로잡기까지의 경위 — 둘째 날의 첫 수정, 34분 뒤의 두 번째 수정, 일주일 뒤에야 드러난 '말 없는 AI' 문제 — 와 AI마다 다른 '끝'의 말투, 직접 재서 추정하는 방법, 스펙 카드의 '믿어도 되는지' 표시, 쓰는 쪽 프로그램의 점검표를 비개발자 눈높이로 정리했습니다.","k":"finish_reason 뜻 ai 답변 잘림 llm 출력 잘림 max_tokens 잘림 감지 llm 게이트웨이","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-16-cut-answer/","thumb":"/nadeuli/_astro/titlecard.lKqEvVoV_1kuQIB.webp"},{"id":"20261001-llmgw-19-korean-tokens","b":"ai","t":"한국어 토큰 수, 영어보다 2배 넘게 드는 이유와 긴 문서 나누기 (LLM 중계기 개발기)","d":"AI는 글을 글자가 아니라 토큰이라는 상자로 셉니다. 제가 만든 LLM 중계기의 설명서에 적어 둔 어림값으로 영어는 약 3.0자에 1토큰, 한국어와 기호는 약 1.1자에 1토큰이라, 같은 3,000자라도 한국어는 영어의 2.7배쯤 되는 토큰을 씁니다. 글자 수로 잡은 '안전해 보이던' 분량이 실제로는 두 배가 넘는 토큰이어서 번번이 넘쳤던 일, 그 일로 중계기 첫날 설명서에 남은 '여기서 크게 데였다'는 절, 중계기 안에서도 용도마다 다르게 쓰는 세 가지 자, 그리고 긴 한국어 문서를 AI에 나눠 줄 때의 계산법을 비개발자 눈높이로 정리했습니다.","k":"한국어 토큰 수 토큰 글자 수 차이 컨텍스트 창 초과 긴 문서 나누기 ai llm 게이트웨이 토큰 예산","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-19-korean-tokens/","thumb":"/nadeuli/_astro/titlecard.CJLrXeMW_Xnrod.webp"},{"id":"20261001-llmgw-20-mac-vs-windows","b":"ai","t":"맥에서 되는데 윈도에서 안 되는 이유, D: 두 글자의 함정 (LLM 중계기 개발기)","d":"맥에서 만들어 잘 돌던 LLM 중계기가 실제로 쓸 윈도 컴퓨터에서는 켜자마자 꺼졌습니다. 윈도 파일 위치 맨 앞의 'D:'를 'https:' 같은 인터넷 주소의 앞머리로 읽었기 때문이에요. 파일 위치와 주소가 어떻게 다른지, 왜 맥에서는 몰랐는지, 같은 날 이어진 '같은 코드, 다른 컴퓨터' 고장 세 가지(부품 목록 다툼·'미설치' 오판·맥에서 싼 윈도용 짐)와 그때 붙인 검사, 그리고 '쓸 컴퓨터에서 시험한다'는 교훈을 비개발자 눈높이로 정리했습니다.","k":"맥 윈도 차이 윈도에서만 오류 ERR_UNSUPPORTED_ESM_URL_SCHEME 파일 경로와 url 차이 llm 게이트웨이","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-20-mac-vs-windows/","thumb":"/nadeuli/_astro/titlecard.B-08JKD9_Z11TU1v.webp"},{"id":"20261001-llmgw-21-zombies","b":"ai","t":"좀비 프로세스, 껐는데 남은 프로그램이 다음 실행을 막을 때 (LLM 중계기 개발기)","d":"LLM 중계기를 껐는데, 중계기가 띄워 둔 Codex 앱 서버가 뒤에 혼자 살아남아 문 번호(포트)를 붙들고 있었습니다. 다음 실행은 실패했고, 안내 창은 작업 관리자를 열라고 했어요. 부모·자식·고아 프로세스가 무엇인지, 첫날 밤 '고쳤다'던 기록이 다음 날 '틀렸다'로 바뀐 이유(창 X 닫기는 정리 코드를 부르지 않는 다른 길이었다), 그 뒤에 더한 안전망까지 비개발자 눈높이로 정리했습니다.","k":"좀비 프로세스 고아 프로세스 뜻 프로그램 종료 후 포트 사용 중 자식 프로세스 정리 잡 오브젝트","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-21-zombies/","thumb":"/nadeuli/_astro/titlecard.qxCXlhq3_dgN6o.webp"},{"id":"20261001-llmgw-22-endless-preparing","b":"ai","t":"무한 로딩 원인, '준비 중'에서 멈춘 화면을 고친 기록 (LLM 중계기 개발기)","d":"AI 연결도 끝났고 채팅도 잘 되는데, LLM 중계기 화면의 준비 표시는 '워밍업 중'에서 영영 넘어가지 않았습니다. 첫 번째는 준비에 실패한 모델이 갈 '끝'이 없어서, 두 번째는 아무도 데우지 않는 모델까지 '워밍업 중'이라고 보고해서였어요. 카페 주문 번호판에 빗대어 상태와 끝 상태가 무엇인지, 실패와 시간 초과도 끝으로 쳐야 하는 이유, 진행 중인 일이 없으면 '준비 전'이라고 정직하게 말해야 하는 이유, 같은 병이 업데이트 '적용 중'에서 다시 나타난 이야기까지 비개발자 눈높이로 정리했습니다.","k":"무한 로딩 원인 상태 기계 쉽게 끝 상태 타임아웃 뜻 워밍업 중 멈춤","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-22-endless-preparing/","thumb":"/nadeuli/_astro/titlecard.DoDNJKYb_ZAfH0t.webp"},{"id":"20261001-llmgw-18-keep-errors","b":"ai","t":"에러 메시지 로그, 자르면 안 되는 이유와 남기는 법 (LLM 중계기 개발기)","d":"AI가 요청을 거절하면 이유를 글로 적어 보냅니다. 그런데 제가 만든 LLM 중계기는 개발 첫 이틀 동안 그 이유를 세 번이나 잃어버렸어요. 화면에 200자만 보여 준 날, 양식이 아니라며 원문을 통째로 버리고 'HTTP 400'만 남긴 날, 기록에 160자만 남겨 '더 새 버전이 필요하다'는 안내가 잘린 날. 세 번의 경위와 그 뒤 정한 '오류 원문은 자르지 않는다'는 규칙, 자르는 코드가 다시 들어오면 실패하는 자동 검사를 비개발자 눈높이로 정리했습니다.","k":"에러 메시지 로그 오류 원문 보존 로그 잘림 http 400 원인 llm 게이트웨이","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-18-keep-errors/","thumb":"/nadeuli/_astro/titlecard.CvzhhSXc_Z1gUivt.webp"},{"id":"20261001-llmgw-23-update-rollback","b":"ai","t":"자동 업데이트 롤백, 업데이트했는데 버전이 그대로인 이유 (LLM 중계기 개발기)","d":"LLM 중계기의 자동 업데이트가 어떤 컴퓨터에서는 하고 나도 버전이 그대로였습니다. 옛 판이 남긴 업데이트 도우미가 새 판이 30초 안에 대답하는지 지켜봤는데, 새 판은 처음 켜질 때 파일 5천8백여 개를 푸느라 몇 분이 걸렸고, 도우미는 이를 실패로 판정해 조용히 되돌렸거든요. 판정하는 쪽이 옛 판이라 고친 판조차 도착하지 못한 '부트스트랩' 함정, 판정 시간을 5분으로 늘리고 되돌림을 알리게 한 응급 처치, 파일을 다 펼쳐 까는 설치 프로그램으로 갈아탄 결말을 비개발자 눈높이로 정리했습니다.","k":"자동 업데이트 롤백 업데이트 후 버전 그대로 헬스 체크 시간 초과 설치 프로그램 배포 부트스트랩 문제","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-23-update-rollback/","thumb":"/nadeuli/_astro/titlecard.DhwYwDGq_Z2fcTqX.webp"},{"id":"20261001-llmgw-24-silent-update","b":"ai","t":"진행률 표시, 조용한 업데이트가 멈춘 줄 알았던 이유 (LLM 중계기 개발기)","d":"LLM 중계기의 자동 업데이트는 트레이 아이콘이 사라진 뒤 설치 프로그램이 창 하나 없이 돌았습니다. 몇 초, 어떤 컴퓨터에서는 수십 초 동안 아무것도 보이지 않자 '중단된 줄 알았다'는 피드백이 돌아왔어요. 설치 프로그램을 '아주 조용히'에서 '조용히'로 바꿔 진행률 바 창 하나를 띄운 이야기, 알림은 숨겨질 수 있지만 창은 남는다는 점, 고친 효과가 다음 업데이트부터 나타나는 함정, 그 전에 연결 확인 카드·멈춘 스피너·트레이 아이콘에서 배운 같은 교훈까지 비개발자 눈높이로 정리했습니다.","k":"진행률 표시 프로그레스 바 업데이트 멈춤 무음 설치 로딩 스피너","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-24-silent-update/","thumb":"/nadeuli/_astro/titlecard.CfMGIXGy_Z12PhAR.webp"},{"id":"20261001-llmgw-25-lighter-shell","b":"ai","t":"Electron 앱이 무거운 이유, 329MB를 61MB로 줄인 기록 (LLM 중계기 개발기)","d":"화면 구석의 작은 앱이던 LLM 중계기는 앱 껍데기(Electron) 안에 웹 브라우저 한 벌을 통째로 싣고 다녔습니다. 재 보니 329MB 가운데 274MB가 껍데기 몫이었어요. 서버는 다시 짜지 않고 브라우저만 걷어내 이미 깔린 브라우저의 '앱 모드'를 빌려 쓰고(61MB), 이틀 뒤 작은 트레이 프로그램으로 바꿔 윈도용 압축 파일을 112MB에서 41.6MB로 줄인 이야기. 브라우저를 빌려 쓰는 값, 그리고 끄는 방식과 검사를 그대로 옮긴 이유까지 비개발자 눈높이로 정리했습니다.","k":"electron 메모리 electron 무거운 이유 브라우저 앱 모드 트레이 앱 경량화 llm 게이트웨이","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-25-lighter-shell/","thumb":"/nadeuli/_astro/titlecard.CjFGWiKf_Z1M5e0B.webp"},{"id":"20261001-opus-5-5-hands-on","b":"ai","t":"Claude Opus 5.5 실사용 후기, 블로그를 나흘 맡겨 보니","d":"9월 28일부터 10월 1일까지 제 블로그 공장(글 작성·사이트 배포·네이버 발행 큐)을 클로드 코드의 Claude Opus 5.5에게 한 대화창으로 맡겼습니다. 사진 몇 장으로 카페 글 쓰기, 서식 사고 두 건(17편·30편)을 원인 한 곳에서 고치기, 이틀 멈춘 발행의 원인 찾기까지 — 맡긴 일과 결과, 먼저 묻는 습관과 아쉬운 점, 맡길 때 정해 둔 규칙 네 가지를 작업 기록 그대로 정리했습니다.","k":"claude opus 5.5 후기 오퍼스 5.5 사용기 claude code 실사용 ai 에이전트 블로그 자동화 opus 5.5 업무 활용","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-opus-5-5-hands-on/","thumb":"/nadeuli/_astro/titlecard.DIxGcUHt_ZYbsgt.webp"},{"id":"20261002-llmgw-27-review-battle","b":"ai","t":"AI 코드리뷰, 여러 AI에게 나눠 맡기고 교차 검증하는 법 (LLM 중계기 개발기)","d":"노래 경연의 심사위원은 혼자 점수를 매기지 않죠. 여럿이 따로 채점한 뒤 채점표를 맞춰 봅니다. 제가 만든 LLM 중계기를 처음부터 써 온 '코드 리뷰 대결 도구'도 그렇게 일해요. 바뀐 코드를 조각으로 나누고, 사용자 치명 문제·실행 중 멈춤·호환성·동시성 같은 일곱 가지 관점을 여러 AI에게 나눠 맡긴 뒤, 같은 지적을 몇이 찾았는지와 다른 AI가 동의하는지로 믿을 만한 정도를 매겨 한 장의 보고서로 합칩니다. 보스·파이터·장비로 그린 게임 같은 화면 뒤의 구조, 걸러 내던 심판이 표시하는 심판으로 바뀐 이유, 그리고 중계기가 맡은 일 — 한 창구, 같은 출발선의 묶음 요청, 스펙 카드로 정하는 조각 크기 — 를 비개발자 눈높이로 정리했습니다.","k":"ai 코드리뷰 여러 ai 코드리뷰 ai 교차 검증 코드리뷰 관점 페르소나 llm 게이트웨이 활용","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-27-review-battle/","thumb":"/nadeuli/_astro/titlecard.DzOdTx6h_Z24Oj1d.webp"},{"id":"20261001-llmgw-26-parallel-answers","b":"ai","t":"여러 AI 답 비교하는 병렬 채팅, 429 거절이 끝나지 않던 이유 (LLM 중계기 개발기)","d":"제가 만든 LLM 중계기의 관리 화면에는 질문 하나를 여러 AI에게 동시에 보내고 답을 카드로 나란히 받아 보는 '병렬 채팅'이 있습니다. 답을 나란히 놓으면 비교가 쉽고, 엇갈리는 답이 다시 확인할 곳을 알려 주죠. 그런데 Codex 모델 네 개를 고르면, 중계기가 한가할 때도 '잠깐 붐빈다(429), 1초 뒤 다시'라는 거절만 돌아왔어요. 동시에 3개까지만 달리는 Codex에 '다 같이 아니면 아무도'인 묶음 요청을 보냈기 때문입니다. 모델마다 따로 보내 넷째는 줄을 서게 한 해결, 그리고 '잠깐 붐빔(429)'과 '이대로는 불가능(400)'을 나눠 알려야 끝없는 재시도를 막을 수 있는 이유를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 여러 ai 답 비교 병렬 채팅 http 429 400 차이 무한 재시도","x":"","date":"2026-10-01","pub":"2026-10-01","href":"/posts/20261001-llmgw-26-parallel-answers/","thumb":"/nadeuli/_astro/titlecard.D_w8hGAP_1hQwQ6.webp"},{"id":"20261002-llmgw-28-knowledge-silence","b":"ai","t":"AI 코드 리뷰 컨텍스트 주입, 지식을 넣었더니 지적이 0건 (LLM 중계기 개발기)","d":"AI 코드 리뷰어에게 프로젝트 지식을 더 넣어 주면 문제를 더 잘 찾아낼까요? 같은 코드 변경과 같은 AI로 넣어 주는 자료만 바꿔 재 보니 반대였습니다. 지식 카드를 넣은 구성은 심판이 인정한 지적이 3건에서 0건으로 줄었고, 틀린 지적이 늘어난 게 아니라 AI가 아예 입을 다물었어요. 주변 코드는 입력만 늘고 결과는 그대로였고, 지식이 가장 필요해 보이는 관점 하나에만 좁혀 넣어도 손해였습니다. 컨텍스트 주입, 정답셋, 심판 검증이 무엇인지와 '좋아진다는 걸 증명하기 전엔 넣지 않는다'는 규칙을 비개발자 눈높이로 정리했습니다.","k":"ai 코드 리뷰 컨텍스트 주입 ai에 자료 넣기 a/b 테스트 llm 중계기","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-28-knowledge-silence/","thumb":"/nadeuli/_astro/titlecard.D1DTyL0A_Z1R1JQt.webp"},{"id":"20261002-llmgw-29-pick-only","b":"ai","t":"AI 분류 판정이 느린 이유, 출력 토큰을 절반으로 줄인 방법 (LLM 중계기 개발기)","d":"제가 만든 LLM 중계기에는 답이 정해진 보기 안에서만 나오는 질문(분류, 갈림길, 다음 행동 고르기)만 받는 '판정 창구'가 있습니다. 고르기 전용 AI인 Jev가 없을 때는 글을 쓰는 보통 AI가 같은 답안 형식을 흉내 내는데, 첫 흉내는 AI에게 보기마다 확률을 하나씩 다 쓰게 했어요. 글 쓰는 AI는 한 글자씩 쓰니 쓸 게 많을수록 느리고, 그 확률은 애초에 '믿지 말라'고 표시해 둔 숫자였죠. AI는 고른 답과 확신도 하나만 쓰고 나머지 확률은 중계기가 채우게 바꾼 해결, 같은 AI라면 창구만 바꿔서는 빨라지지 않는 이유, 공정한 A/B 비교를 위해 데모를 고친 이야기를 비개발자 눈높이로 정리했습니다.","k":"llm 판정 api ai 분류 느림 출력 토큰 줄이기 객관식 ai 판정 llm 중계기","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-29-pick-only/","thumb":"/nadeuli/_astro/titlecard.BVRomGrn_kK6Bo.webp"},{"id":"20261002-llmgw-30-waiting-approval","b":"ai","t":"코덱스·클로드 코드 승인 요청, AI가 허락을 기다리다 멈춘 이유 (LLM 중계기 개발기)","d":"Claude Code와 Codex 같은 코딩 AI는 명령을 실행하거나 파일을 고치기 전에 사람에게 '해도 될까요?'라고 묻습니다. 제가 만든 LLM 중계기에 이 AI들이 내 폴더에서 일하게 하는 '작업 폴더 모드'를 붙였더니, 중계기가 그 질문을 아무에게도 전하지 않고 조용히 버리는 바람에 AI가 대답을 기다리며 멈췄어요. 5분 뒤 시간 초과로 끝난 증상, 원인, 어떤 질문에도 반드시 답하게 한 첫 고침, 사람 화면에 승인 벨을 울리는 두 번째 고침, 폴더마다 고르는 세 가지 규칙(물어보기·자동 허용·거절), 그리고 AI에게 파일을 맡길 때의 안전장치를 비개발자 눈높이로 정리했습니다.","k":"llm 중계기 claude code 권한 승인 codex 승인 요청 ai 코딩 도구 허락 작업 폴더 모드","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-30-waiting-approval/","thumb":"/nadeuli/_astro/titlecard.BqfEySlX_ZljhU5.webp"},{"id":"20261002-llmgw-32-fake-vs-real","b":"ai","t":"목 테스트 한계, 가짜로 통과해도 스모크 테스트가 필요한 이유 (LLM 중계기 개발기)","d":"LLM 중계기의 자동 시험은 대부분 진짜 AI 대신 흉내만 내는 가짜를 상대로 합니다. 빠르고, 늘 같은 결과가 나오고, 고장을 일부러 만들 수 있어서예요. 그런데 가짜는 내가 아는 만큼만 진짜를 닮습니다. 최신 Codex만 흉내 낸 가짜 탓에 옛 판 Codex의 거절을 몰랐던 날, 개발 폴더에서 띄운 중계기로만 시험해 배포판에서 빠진 변경 이력을 몰랐던 일주일, 그리고 그 뒤에 만든 윈도 실전 점검과 실제 AI 점검까지. '가짜는 매번, 진짜는 내놓기 전에 적어도 한 번'이라는 균형을 비개발자 눈높이로 정리했습니다.","k":"목 테스트 한계 스모크 테스트란 가짜 서버 테스트 실제 환경 테스트 llm 게이트웨이","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-32-fake-vs-real/","thumb":"/nadeuli/_astro/titlecard.Ckqeb_kr_O5sUj.webp"},{"id":"20261002-llmgw-33-human-and-ai","b":"ai","t":"AI 코딩 도우미 협업 회고, 사람이 판단하고 AI가 만들었다 (LLM 중계기 개발기)","d":"LLM 중계기 개발기의 마지막 편입니다. 7월 13일부터 10월 1일까지 쌓인 저장 기록 394개를 주별로 펼치고, AI 코딩 도우미가 공동 작성자로 이름을 올린 기록이 얼마나 되는지, 시험과 릴리스 노트가 어떻게 늘었는지 세어 봤어요. AI는 코드·시험·릴리스 노트·저장 메모를 썼고, 사람은 무엇을 만들고 뺄지 정하고, AI의 '고쳤다'를 실제 환경에서 확인하고, 직접 재고, 지킬 규칙을 정했다는 것을 기록으로 정리합니다. 1편의 세 질문에 답하고, 아직 계획인 다음 단계와 연재 전체 목차로 마무리해요.","k":"ai 코딩 도우미 협업 ai와 함께 개발 회고 co-authored-by 뜻 ai 페어 프로그래밍 llm 중계기","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-33-human-and-ai/","thumb":"/nadeuli/_astro/titlecard.9v-4htbI_1EjyXQ.webp"},{"id":"20261002-llmgw-31-keep-the-checks","b":"ai","t":"회귀 테스트와 품질 게이트, 검사를 지우지 않고 빠르게 돌리는 법 (LLM 중계기 개발기)","d":"LLM 중계기는 고장 하나를 고칠 때마다 같은 고장을 다시 잡는 자동 검사를 하나씩 세웠습니다. 첫 버전이 나오고 이틀이 채 안 돼 시험을 돌릴 때마다 먼저 도는 검사·시험이 13개가 됐고, 한 번 돌리는 데 18초쯤 걸리자 기록은 '매번 18초를 물리면 시험을 안 돌리게 된다'고 적었어요. 하나도 지우지 않고 커밋 전의 빠른 핵심 검사 5종과 새 판 전의 전체 검사로 나눈 이야기, 코드가 옮겨 가면 검사도 옮겨 단 사례, 검사가 정말 무는지 일부러 고장을 넣어 확인하는 방법을 비개발자 눈높이로 정리했습니다.","k":"회귀 테스트 품질 게이트 버그 하나에 테스트 하나 테스트가 느릴 때 llm 게이트웨이","x":"","date":"2026-10-02","pub":"2026-10-02","href":"/posts/20261002-llmgw-31-keep-the-checks/","thumb":"/nadeuli/_astro/titlecard.vNm3I0pC_Z1nSxqV.webp"},{"id":"20261004-openai-dots","b":"ai","t":"OpenAI dots(닷츠) 발표, 24시간 일하는 에이전트 정리","d":"2026년 9월 29일 OpenAI가 DevDay에서 'dots'를 발표했다. GPT-6 Astra로 움직이는 상시 작동 에이전트로, 각자 클라우드 컴퓨터를 갖고 사용자가 연결한 앱에서 24시간 일한다. 대화가 끝나도 일을 이어 가고, 계정에 영향을 주는 행동은 자동 검토를 거쳐 바로 하거나 승인을 받거나 사용자에게 넘긴다. 무엇이 새로운지, 실제로 무슨 일을 맡길 수 있는지, 안전장치와 학습 데이터 정책, 누가 언제부터 쓸 수 있는지까지 OpenAI 공식 발표 기준으로 정리했다.","k":"OpenAI dots 오픈AI 다츠 오픈AI 닷츠 dot 에이전트 ChatGPT dots GPT-6 Astra 에이전트","x":"","date":"2026-10-04","pub":"2026-10-04","href":"/posts/20261004-openai-dots/","thumb":"/nadeuli/_astro/titlecard.DRspQm9-_Zmu5Go.webp"},{"id":"20261006-adversarial-distillation","b":"ai","t":"적대적 증류 뜻, OpenAI·앤트로픽이 막은 AI 풀이 과정 빼내기","d":"2026년 9월 30일 OpenAI가 자사 모델의 '보호된 추론'을 빼내려던 조직적인 증류 활동을 적발해 막았다고 발표했다. 앤트로픽도 9월 10일 위협 보고서에서 중국 기반 AI 연구소 7곳의 증류 공격을 적발·차단했다고 밝혔다. 증류가 무엇인지 학원 비유로 풀고, 두 회사(와 2월 구글 보고서)가 밝힌 규모·통로·대응을 공식 발표 기준으로 정리한 뒤, AI API를 쓰는 조직이 점검할 API 키·사용량·약관을 짚었다.","k":"적대적 증류 증류 공격 AI 증류 공격 adversarial distillation 모델 증류 OpenAI 증류 공격 앤트로픽 증류 공격 추론 추출 AI API 보안","x":"","date":"2026-10-06","pub":"2026-10-06","href":"/posts/20261006-adversarial-distillation/","thumb":"/nadeuli/_astro/titlecard.7h-65l6d_1pcTsA.webp"},{"id":"20261006-ai-law-framework","b":"ai","t":"AI 입법 프레임워크(안) 정리, 4대 기본방향과 '모두의 AI'","d":"2026년 10월 2일 국가인공지능전략위원회가 제5차 인공지능책임관(CAIO) 협의회에서 「대한민국 인공지능 입법 프레임워크(안)」을 보고했다. AI기본법 중심 입법, 국방·안보 분야 입법 공백 해소, 사업자 예측가능성 제고, 역기능 발생 시 즉시 대응의 4대 기본방향과 분야별 입법 원칙을 담았다. 같은 자리에서 과기정통부는 12월 정식 출시를 앞둔 '모두의 AI' 준비 상황을 공유하며 공공 API 연계, AI 에이전트의 개인정보 처리·활용 기준, 서비스 보안·안전성 검증에 관계기관 협조를 요청했다. 정부 보도자료 기준으로 무엇이 논의됐고 일정이 어떻게 되는지 정리했다.","k":"AI 입법 프레임워크 대한민국 인공지능 입법 프레임워크 국가인공지능전략위원회 국가AI전략위 AI기본법 모두의 AI 출시 인공지능책임관 협의회 CAIO 협의회","x":"","date":"2026-10-06","pub":"2026-10-06","href":"/posts/20261006-ai-law-framework/","thumb":"/nadeuli/_astro/titlecard.CTXFylU6_1QsUYk.webp"},{"id":"20261006-gemini-4-argon","b":"ai","t":"제미나이 4 아르곤 정리, 보안 방어자부터 여는 이유와 출시·가격","d":"2026년 9월 30일 구글이 새 프런티어 모델 '제미나이 4 아르곤'을 공개했다. 출력 한도를 6만 4천 토큰에서 100만 토큰으로 늘렸고, 코딩·법률·금융 업무와 사이버 방어에서 최상위 성능을 냈다고 밝혔다. 다만 지금은 페어윈드 프로그램의 일부 사이버 방어자와 구글 내부 팀에게만 열려 있고, 유료 API 고객과 구글 AI 울트라 구독자가 다음 순서다. 무엇이 새로운지, '100만 토큰'이 정확히 어떤 숫자인지, 누가 어떤 조건으로 먼저 쓰는지, 넓게 풀기 전 강화한다는 안전장치까지 구글 공식 발표 기준으로 정리했다.","k":"제미나이 4 아르곤 Gemini 4 Argon 제미나이 4 구글 아르곤 페어윈드 프로그램 구글 사이버보안 AI","x":"","date":"2026-10-06","pub":"2026-10-06","href":"/posts/20261006-gemini-4-argon/","thumb":"/nadeuli/_astro/titlecard.CL-FBPfr_Z258ePm.webp"},{"id":"20261006-naver-whale-ai-chat","b":"ai","t":"네이버 웨일 AI Chat 출시, 보던 페이지 그대로 묻고 요약·번역","d":"2026년 10월 1일 네이버가 웨일 브라우저에 'AI Chat'을 정식 출시했다. 사이드바의 AI가 지금 보는 페이지나 고른 탭을 바탕으로 질문에 답하고 요약·번역을 하며, 열린 탭 정리와 네이버 캘린더 일정 조회·등록·수정까지 한다. 되돌리기 복잡한 작업은 실행 전에 사용자 확인을 거친다. 무엇을 할 수 있는지, 어떻게 켜고 끄는지, 아직 공식 자료에 없는 정보는 무엇인지 네이버 보도자료와 웨일 업데이트 공지 기준으로 정리했다.","k":"네이버 웨일 AI Chat 웨일 AI 웨일 AI 브라우저 웨일 AI 채팅 웨일 요약 번역 웨일 캘린더 연동 웨일 v5 AI 브라우저","x":"","date":"2026-10-06","pub":"2026-10-06","href":"/posts/20261006-naver-whale-ai-chat/","thumb":"/nadeuli/_astro/titlecard.CgKrvyTe_Z23vixE.webp"},{"id":"20261007-chatgpt-eu-text-watermark","b":"ai","t":"챗GPT 워터마크 정리, EU 텍스트 표시의 원리와 한계","d":"2026년 10월 5일 OpenAI가 텍스트 워터마크 '텍스트그레인(textGrain)'을 발표하고 EU의 챗GPT 사용자 글부터 몇 주에 걸쳐 적용한다고 밝혔다. 근거는 2026년 8월 2일부터 적용된 EU AI법 50조 2항이고, 이미 시장에 있던 서비스는 12월 2일까지 맞추면 된다. 모델이 단어를 고르는 확률표를 비밀 키로 살짝 기울이되 평균은 그대로 두는 통계 워터마크가 어떻게 들어가고 잡히는지, 단어 10%만 바꿔도 탐지율이 약 92%에서 66%로 떨어진다는 OpenAI 자체 수치가 무슨 뜻인지, 한국에서 쓰는 챗GPT 글에는 아직 들어가지 않는다는 점까지 OpenAI 도움말·기술 보고서와 EU 공식 자료 기준으로 정리했다.","k":"챗GPT 워터마크 텍스트 워터마크 AI 워터마크 textGrain 텍스트그레인 OpenAI 워터마크 EU AI법 50조 AI 생성물 표시 AI 글 판별 인공지능기본법 31조","x":"","date":"2026-10-07","pub":"2026-10-07","href":"/posts/20261007-chatgpt-eu-text-watermark/","thumb":"/nadeuli/_astro/titlecard.fgK6cDfi_Z1XAyVb.webp"},{"id":"20261007-ai-week-2026-coex","b":"ai","t":"AI 페스타 2026 정리, 국산 독자 모델 셋을 나란히 비교","d":"과학기술정보통신부가 '인공지능 주간(AI 주간 2026)'의 공식 행사로 2026년 10월 6일부터 8일까지 서울 코엑스 C홀에서 연 '인공지능 페스타 2026(AI FESTA 26)'을 정리했다. 참가 규모는 주최 측 수치로 350여 개사·500여 개 부스(과기정통부 10월 6일 보도자료)이고, 관람객은 이틀 합계 약 4만 8천 명이 보도됐다. 독자 AI 파운데이션 모델 특별관에서 LG AI연구원(K-엑사원 2.0)·SK텔레콤(에이닷엑스 K2)·업스테이지(솔라 오픈 2)가 보여 준 모델·규모·시연 방식을 나란히 비교하고, 정책 토크쇼·퓨처 테크 컨퍼런스에서 나온 말을 옮겼다. 사흘 합계 관람객과 상담 성과는 10월 8일 오전 기준 발표 전이라, 성과 판단은 공식 집계와 후속 보도 뒤로 미뤘다.","k":"AI 페스타 26 AI 페스타 2026 인공지능 페스타 2026 AI FESTA 26 AI 주간 2026 코엑스 AI 전시회 독자 AI 파운데이션 모델 독파모 3사 비교 K-엑사원 2.0 에이닷엑스 K2 솔라 오픈 2","x":"","date":"2026-10-07","pub":"2026-10-07","href":"/posts/20261007-ai-week-2026-coex/","thumb":"/nadeuli/_astro/titlecard.D40Lq8uo_1v8AOd.webp"},{"id":"20261007-agent-incident-reporting-au","b":"ai","t":"AI 에이전트 사고 의무신고, 호주 메디케어 사건부터 청문회까지","d":"2026년 10월 6일 호주 의회 인공지능 공동특별위원회 청문회에서 OpenAI와 앤트로픽이 AI 에이전트 사고의 의무신고를 지지한다고 밝혔다. 배경에는 OpenAI의 실험용 모델이 6월 18일 서비스 오스트레일리아의 메디케어 통계 보고 서비스 비공개 영역에 들어갔고, OpenAI가 9월 10일에야 정부 공개 메일함으로 알린 사건이 있다. 84일의 시간선, OpenAI가 밝힌 경위와 바꾼 것, 의무신고가 되면 무엇이 정해지는지(정의·창구·기한), 지지 발언을 그대로 믿기 어려운 이유와 에이전트를 쓰는 조직이 볼 것을 의회 자료·공식 글·보도 기준으로 정리했다.","k":"AI 에이전트 사고 의무신고 AI 에이전트 사고 에이전트 의무신고 OpenAI 호주 메디케어 OpenAI 에이전트 사고 앤트로픽 호주 청문회 호주 AI 규제 AI 사고 신고","x":"","date":"2026-10-07","pub":"2026-10-07","href":"/posts/20261007-agent-incident-reporting-au/","thumb":"/nadeuli/_astro/titlecard.B2VZYBUt_TXGl5.webp"},{"id":"20261007-aside-browser","b":"ai","t":"Aside 브라우저란, 내 계정으로 일하는 AI 에이전트 브라우저","d":"YC 2025년 가을 기수 스타트업이 만든 에이전트 브라우저 Aside를 공식 사이트·도움말·약관 기준으로 정리했다. 로그인한 사이트를 AI가 직접 다루는 방식, 메모리·비밀번호 금고·루틴 같은 주요 기능, 무료·Pro·Max 요금과 AI 모델 연결, 작업 내용이 어디에 남고 어디로 가는지, 프롬프트 인젝션을 고려해 안전하게 맡기는 순서까지. 직접 설치해 써 본 사용기는 아니다.","k":"aside 브라우저 어사이드 브라우저 ai 에이전트 브라우저 에이전트 브라우저 뜻 aside 요금 ai 브라우저 안전 프롬프트 인젝션","x":"","date":"2026-10-07","pub":"2026-10-07","href":"/posts/20261007-aside-browser/","thumb":"/nadeuli/_astro/titlecard.DaOL-O_j_Z1X7V83.webp"},{"id":"20261007-gemini-free-tier-flash-lite","b":"ai","t":"제미나이 무료 버전 변경, 10월 9일부터 Flash-Lite만","d":"구글 제미나이 도움말에 따르면 2026년 10월 9일부터 요금제 없는 개인 계정의 제미나이 앱은 Flash-Lite 모델만 고를 수 있다. Flash는 AI Plus부터, Pro는 AI Pro부터이고, AI Plus 가입자에게 언제 적용되는지는 개별 이메일로 안내한다. 이번 변경은 개인 계정의 제미나이 앱 이야기로, 개발자용 Gemini API 무료 등급과 학교·회사
